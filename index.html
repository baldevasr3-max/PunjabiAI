<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PunjabAI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
    }

    /* LOGIN PAGE */
    #auth-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      text-align: center;
    }

    .auth-box h1 {
      color: #5b3cc4;
      margin-bottom: 10px;
    }

    .auth-box p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #5b3cc4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #4529a0;
    }

    .switch {
      margin-top: 18px;
      color: #555;
      cursor: pointer;
    }

    .switch span {
      color: #5b3cc4;
      font-weight: bold;
    }

    #message {
      margin-top: 12px;
      font-size: 14px;
      color: red;
    }

    /* CHAT PAGE */
    #chat-page {
      display: none;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .chat-container {
      width: 100%;
      max-width: 650px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .header {
      background: linear-gradient(135deg, #5b3cc4, #6f4db8);
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    .logout-btn {
      position: absolute;
      right: 15px;
      top: 15px;
      background: white;
      color: #5b3cc4;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background: #f5f5f5;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-message {
      background: #5b3cc4;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }

    .bot-message {
      background: white;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 3px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .input-area {
      display: flex;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #user-input {
      flex: 1;
      margin: 0;
      margin-right: 8px;
    }

    .send-btn {
      background: #5b3cc4;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <!-- LOGIN / SIGNUP PAGE -->
  <div id="auth-page">

    <div class="auth-box">

      <h1>🤖 PunjabAI</h1>
      <p>ਪੰਜਾਬੀ AI Assistant ਵਿੱਚ ਤੁਹਾਡਾ ਸਵਾਗਤ ਹੈ</p>

      <div id="login-form">
        <input type="email" id="login-email" placeholder="Email Address">
        <input type="password" id="login-password" placeholder="Password">

        <button class="btn" onclick="loginUser()">Login</button>

        <div class="switch">
          ਨਵਾਂ Account ਹੈ?
          <span onclick="showSignup()">Sign Up</span>
        </div>
      </div>


      <div id="signup-form" style="display:none;">
        <input type="email" id="signup-email" placeholder="Email Address">
        <input type="password" id="signup-password" placeholder="Password (minimum 6 characters)">

        <button class="btn" onclick="signupUser()">Create Account</button>

        <div class="switch">
          ਪਹਿਲਾਂ ਹੀ Account ਹੈ?
          <span onclick="showLogin()">Login</span>
        </div>
      </div>

      <div id="message"></div>

    </div>
  </div>


  <!-- CHAT PAGE -->
  <div id="chat-page">

    <div class="chat-container">

      <div class="header">
        <h1>🤖 PunjabAI Assistant</h1>
        <p>ਪੰਜਾਬੀ ਵਿੱਚ ਕੋਈ ਵੀ ਸਵਾਲ ਪੁੱਛੋ</p>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>

      <div id="chat-box">
        <div class="message bot-message">
          ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ ਜੀ 🙏 ਮੈਂ PunjabAI ਹਾਂ। ਮੈਂ ਤੁਹਾਡੀ ਕੀ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ?
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="ਆਪਣਾ ਸਵਾਲ ਲਿਖੋ..."
          onkeypress="handleEnter(event)"
        >
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>

    </div>
  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // =====================================
    // PASTE YOUR FIREBASE CONFIG HERE
    // =====================================

    const firebaseConfig = {

      apiKey: "PASTE_YOUR_API_KEY",

      authDomain: "PASTE_YOUR_AUTH_DOMAIN",

      projectId: "PASTE_YOUR_PROJECT_ID",

      storageBucket: "PASTE_YOUR_STORAGE_BUCKET",

      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",

      appId: "PASTE_YOUR_APP_ID"

    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // SHOW SIGNUP
    window.showSignup = function() {
      document.getElementById("login-form").style.display = "none";
      document.getElementById("signup-form").style.display = "block";
      document.getElementById("message").innerText = "";
    };


    // SHOW LOGIN
    window.showLogin = function() {
      document.getElementById("signup-form").style.display = "none";
      document.getElementById("login-form").style.display = "block";
      document.getElementById("message").innerText = "";
    };


    // SIGNUP
    window.signupUser = async function() {

      const email =
        document.getElementById("signup-email").value;

      const password =
        document.getElementById("signup-password").value;

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        document.getElementById("message").style.color = "green";
        document.getElementById("message").innerText =
          "Account successfully created! 🎉";

      } catch (error) {

        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText =
          error.message;

      }
    };


    // LOGIN
    window.loginUser = async function() {

      const email =
        document.getElementById("login-email").value;

      const password =
        document.getElementById("login-password").value;

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText =
          "Login failed: " + error.message;

      }
    };


    // LOGOUT
    window.logoutUser = async function() {

      try {
        await signOut(auth);
      } catch (error) {
        alert(error.message);
      }

    };


    // AUTH STATE
    onAuthStateChanged(auth, (user) => {

      if (user) {

        document.getElementById("auth-page").style.display = "none";

        document.getElementById("chat-page").style.display = "flex";

      } else {

        document.getElementById("auth-page").style.display = "flex";

        document.getElementById("chat-page").style.display = "none";

      }

    });


    // SEND MESSAGE TO AI
    window.sendMessage = async function() {

      const input =
        document.getElementById("user-input");

      const message = input.value.trim();

      if (!message) return;


      const chatBox =
        document.getElementById("chat-box");


      chatBox.innerHTML +=
        `<div class="message user-message">${message}</div>`;

      input.value = "";


      chatBox.innerHTML +=
        `<div class="message bot-message" id="loading">
          ਸੋਚ ਰਿਹਾ ਹਾਂ... 🤔
        </div>`;


      chatBox.scrollTop =
        chatBox.scrollHeight;


      try {

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        const data =
          await response.json();


        document.getElementById("loading").remove();


        chatBox.innerHTML +=
          `<div class="message bot-message">
            ${data.reply}
          </div>`;


      } catch (error) {

        document.getElementById("loading").remove();


        chatBox.innerHTML +=
          `<div class="message bot-message">
            ਮਾਫ ਕਰਨਾ ਜੀ, ਕੋਈ error ਆ ਗਈ।
          </div>`;

      }


      chatBox.scrollTop =
        chatBox.scrollHeight;

    };


    // ENTER KEY
    window.handleEnter = function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    };

  </script>

</body>
</html>
