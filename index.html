<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PunjabiAI Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.chat-container {
    width: 100%;
    max-width: 650px;
    height: 90vh;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.header {
    background: linear-gradient(135deg, #5b3cc4, #6f4db8);
    color: white;
    padding: 25px 20px;
    text-align: center;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.header p {
    font-size: 16px;
    opacity: 0.9;
}

#chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f5f5f5;
}

.message {
    max-width: 85%;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 18px;
    line-height: 1.6;
    font-size: 17px;
    word-wrap: break-word;
}

.bot {
    background: white;
    color: #333;
    border-bottom-left-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.user {
    background: linear-gradient(135deg, #5b3cc4, #6f4db8);
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: white;
    border-top: 1px solid #ddd;
}

#user-input {
    flex: 1;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 25px;
    font-size: 16px;
    outline: none;
}

#user-input:focus {
    border-color: #5b3cc4;
}

button {
    width: 55px;
    height: 55px;
    border: none;
    border-radius: 50%;
    background: #5b3cc4;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

button:hover {
    background: #482fa0;
}

@media (max-width: 500px) {
    .chat-container {
        height: 95vh;
        border-radius: 20px;
    }

    .header h1 {
        font-size: 24px;
    }

    .message {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>🤖 PunjabiAI Assistant</h1>
        <p>ਤੁਹਾਡਾ ਆਪਣਾ ਪੰਜਾਬੀ AI ਸਹਾਇਕ</p>
    </div>

    <div id="chat-box">

        <div class="message bot">
            ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ ਜੀ! 🙏 ਮੈਂ PunjabiAI ਹਾਂ।<br>
            ਮੈਂ ਤੁਹਾਡੀ ਕਿਵੇਂ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ?
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="ਆਪਣਾ ਸਵਾਲ ਲਿਖੋ..."
        >

        <button onclick="sendMessage()">➤</button>

    </div>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("user-input");
    const message = input.value.trim();

    if (message === "") return;

    const chatBox = document.getElementById("chat-box");

    // User message
    chatBox.innerHTML += `
        <div class="message user">${message}</div>
    `;

    input.value = "";

    // Loading message
    const loadingId = "loading-" + Date.now();

    chatBox.innerHTML += `
        <div class="message bot" id="${loadingId}">
            ਸੋਚ ਰਿਹਾ ਹਾਂ... 🤔
        </div>
    `;

    chatBox.scrollTop = chatBox.scrollHeight;

    try {

        const response = await fetch("/api/chat", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        const loadingMessage = document.getElementById(loadingId);

        if (data.reply) {
            loadingMessage.innerText = data.reply;
        } else {
            loadingMessage.innerText = "ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਮਿਲਿਆ ਜੀ।";
        }

    } catch (error) {

        document.getElementById(loadingId).innerText =
            "ਮਾਫ ਕਰਨਾ ਜੀ, AI ਨਾਲ connection ਵਿੱਚ ਸਮੱਸਿਆ ਆ ਗਈ।";

        console.error(error);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}


// Enter key support
document.getElementById("user-input")
.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
