
    .

        <button id="logout-btn">
          Logout
        </button>

      </div>


      <div id="chat-box">

        <div class="welcome">

          <h2>ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ ਜੀ 🙏</h2>

          <p>
            ਮੈਂ PunjabAI ਹਾਂ। ਤੁਸੀਂ ਮੈਨੂੰ ਪੰਜਾਬੀ,
            Hindi ਜਾਂ English ਵਿੱਚ ਕੋਈ ਵੀ ਸਵਾਲ ਪੁੱਛ ਸਕਦੇ ਹੋ।
          </p>

        </div>

      </div>


      <div class="input-area">

        <input
          type="text"
          id="message-input"
          placeholder="ਆਪਣਾ ਸਵਾਲ ਲਿਖੋ..."
        >

        <button id="send-btn">
          Send
        </button>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
       ਆਪਣੀ Firebase config ਇੱਥੇ paste ਕਰੋ
    ========================== */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "YOUR_PROJECT.firebaseapp.com",

      projectId: "YOUR_PROJECT_ID",

      storageBucket: "YOUR_PROJECT.appspot.com",

      messagingSenderId: "YOUR_SENDER_ID",

      appId: "YOUR_APP_ID"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =========================
       ELEMENTS
    ========================== */

    const authPage =
      document.getElementById("auth-page");

    const chatPage =
      document.getElementById("chat-page");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const errorMessage =
      document.getElementById("error-message");

    const loginBtn =
      document.getElementById("login-btn");

    const signupBtn =
      document.getElementById("signup-btn");

    const logoutBtn =
      document.getElementById("logout-btn");

    const chatBox =
      document.getElementById("chat-box");

    const messageInput =
      document.getElementById("message-input");

    const sendBtn =
      document.getElementById("send-btn");


    /* =========================
       SIGN UP
    ========================== */

    signupBtn.addEventListener("click", async () => {

      try {

        errorMessage.innerText = "";

        await createUserWithEmailAndPassword(
          auth,
          email.value,
          password.value
        );

      }

      catch(error) {

        errorMessage.innerText =
          error.message;

      }

    });


    /* =========================
       LOGIN
    ========================== */

    loginBtn.addEventListener("click", async () => {

      try {

        errorMessage.innerText = "";

        await signInWithEmailAndPassword(
          auth,
          email.value,
          password.value
        );

      }

      catch(error) {

        errorMessage.innerText =
          "Login failed: " + error.message;

      }

    });


    /* =========================
       LOGOUT
    ========================== */

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });


    /* =========================
       AUTH STATE
    ========================== */

    onAuthStateChanged(auth, (user) => {

      if(user) {

        authPage.style.display = "none";

        chatPage.style.display = "flex";

      }

      else {

        authPage.style.display = "flex";

        chatPage.style.display = "none";

      }

    });


    /* =========================
       ADD MESSAGE
    ========================== */

    function addMessage(text, sender) {

      const message =
        document.createElement("div");

      message.classList.add(
        "message"
      );

      if(sender === "user") {

        message.classList.add(
          "user-message"
        );

      }

      else {

        message.classList.add(
          "bot-message"
        );

      }

      message.innerText = text;

      chatBox.appendChild(message);

      chatBox.scrollTop =
        chatBox.scrollHeight;

    }


    /* =========================
       SEND MESSAGE TO AI
    ========================== */

    async function sendMessage() {

      const message =
        messageInput.value.trim();

      if(!message) return;


      addMessage(
        message,
        "user"
      );

      messageInput.value = "";


      const loadingMessage =
        document.createElement("div");

      loadingMessage.classList.add(
        "message",
        "bot-message"
      );

      loadingMessage.innerText =
        "PunjabAI ਸੋਚ ਰਿਹਾ ਹੈ...";

      chatBox.appendChild(
        loadingMessage
      );

      chatBox.scrollTop =
        chatBox.scrollHeight;


      try {

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        const data =
          await response.json();


        loadingMessage.remove();


        if(data.reply) {

          addMessage(
            data.reply,
            "bot"
          );

        }

        else {

          addMessage(
            "ਮਾਫ ਕਰਨਾ ਜੀ, ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਮਿਲਿਆ।",
            "bot"
          );

        }

      }

      catch(error) {

        loadingMessage.remove();

        addMessage(
          "Server ਨਾਲ connection ਨਹੀਂ ਹੋ ਸਕਿਆ ਜੀ।",
          "bot"
        );

      }

    }


    /* SEND BUTTON */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER KEY */

    messageInput.addEventListener(
      "keypress",
      function(event) {

        if(event.key === "Enter") {

          sendMessage();

        }

      }
    );

  </script>
