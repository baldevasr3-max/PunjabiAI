<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PunjabAI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
    }

    /* LOGIN PAGE */

    #auth-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      text-align: center;
    }

    .auth-box h1 {
      color: #5b3cc4;
      margin-bottom: 10px;
    }

    .auth-box p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #5b3cc4;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #5b3cc4;
      color: white;
      font-weight: bold;
    }

    .btn:hover {
      background: #452ca0;
    }

    .switch {
      margin-top: 20px;
      color: #555;
    }

    .switch span {
      color: #5b3cc4;
      font-weight: bold;
      cursor: pointer;
    }

    #error-message {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    /* CHAT PAGE */

    #chat-page {
      display: none;
      min-height: 100vh;
      padding: 15px;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    .header {
      background: linear-gradient(135deg, #5b3cc4, #764ba2);
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 25px;
    }

    .header p {
      margin-top: 5px;
      font-size: 14px;
      opacity: 0.9;
    }

    #logout-btn {
      position: absolute;
      right: 15px;
      top: 18px;
      width: auto;
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 13px;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f6fa;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border-radius: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-message {
      background: #5b3cc4;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      background: white;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .input-area {
      display: flex;
      padding: 12px;
      gap: 10px;
      background: white;
      border-top: 1px solid #eee;
    }

    #message-input {
      flex: 1;
      margin: 0;
    }

    #send-btn {
      width: auto;
      padding: 12px 20px;
      margin: 0;
      background: #5b3cc4;
      color: white;
      font-weight: bold;
    }

    .welcome {
      text-align: center;
      color: #666;
      margin-top: 50px;
    }

    .welcome h2 {
      color: #5b3cc4;
      margin-bottom: 10px;
    }

    @media(max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }

      #chat-page {
        padding: 0;
      }

      .message {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH PAGE -->

  <div id="auth-page">

    <div class="auth-box">

      <h1>🙏 PunjabAI</h1>

      <p id="auth-title">
        ਆਪਣੇ ਪੰਜਾਬੀ AI Assistant ਵਿੱਚ Login ਕਰੋ
      </p>

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button class="btn" id="login-btn">
        Login
      </button>

      <button class="btn" id="signup-btn">
        Create New Account
      </button>

      <div id="error-message"></div>

    </div>

  </div>


  <!-- CHAT PAGE -->

  <div id="chat-page">

    <div class="chat-container">

      <div class="header">

        <h1>🙏 PunjabAI Assistant</h1>

        <p>ਤੁਹਾਡਾ ਆਪਣਾ ਪੰਜਾਬੀ AI ਸਹਾਇਕ</p>

        <button id="logout-btn">
          Logout
        </button>

      </div>


      <div id="chat-box">

        <div class="welcome">

          <h2>ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ ਜੀ 🙏</h2>

          <p>
            ਮੈਂ PunjabAI ਹਾਂ। ਤੁਸੀਂ ਮੈਨੂੰ ਪੰਜਾਬੀ,
            Hindi ਜਾਂ English ਵਿੱਚ ਕੋਈ ਵੀ ਸਵਾਲ ਪੁੱਛ ਸਕਦੇ ਹੋ।
          </p>

        </div>

      </div>


      <div class="input-area">

        <input
          type="text"
          id="message-input"
          placeholder="ਆਪਣਾ ਸਵਾਲ ਲਿਖੋ..."
        >

        <button id="send-btn">
          Send
        </button>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
       ਆਪਣੀ Firebase config ਇੱਥੇ paste ਕਰੋ
    ========================== */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "YOUR_PROJECT.firebaseapp.com",

      projectId: "YOUR_PROJECT_ID",

      storageBucket: "YOUR_PROJECT.appspot.com",

      messagingSenderId: "YOUR_SENDER_ID",

      appId: "YOUR_APP_ID"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =========================
       ELEMENTS
    ========================== */

    const authPage =
      document.getElementById("auth-page");

    const chatPage =
      document.getElementById("chat-page");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const errorMessage =
      document.getElementById("error-message");

    const loginBtn =
      document.getElementById("login-btn");

    const signupBtn =
      document.getElementById("signup-btn");

    const logoutBtn =
      document.getElementById("logout-btn");

    const chatBox =
      document.getElementById("chat-box");

    const messageInput =
      document.getElementById("message-input");

    const sendBtn =
      document.getElementById("send-btn");


    /* =========================
       SIGN UP
    ========================== */

    signupBtn.addEventListener("click", async () => {

      try {

        errorMessage.innerText = "";

        await createUserWithEmailAndPassword(
          auth,
          email.value,
          password.value
        );

      }

      catch(error) {

        errorMessage.innerText =
          error.message;

      }

    });


    /* =========================
       LOGIN
    ========================== */

    loginBtn.addEventListener("click", async () => {

      try {

        errorMessage.innerText = "";

        await signInWithEmailAndPassword(
          auth,
          email.value,
          password.value
        );

      }

      catch(error) {

        errorMessage.innerText =
          "Login failed: " + error.message;

      }

    });


    /* =========================
       LOGOUT
    ========================== */

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

    });


    /* =========================
       AUTH STATE
    ========================== */

    onAuthStateChanged(auth, (user) => {

      if(user) {

        authPage.style.display = "none";

        chatPage.style.display = "flex";

      }

      else {

        authPage.style.display = "flex";

        chatPage.style.display = "none";

      }

    });


    /* =========================
       ADD MESSAGE
    ========================== */

    function addMessage(text, sender) {

      const message =
        document.createElement("div");

      message.classList.add(
        "message"
      );

      if(sender === "user") {

        message.classList.add(
          "user-message"
        );

      }

      else {

        message.classList.add(
          "bot-message"
        );

      }

      message.innerText = text;

      chatBox.appendChild(message);

      chatBox.scrollTop =
        chatBox.scrollHeight;

    }


    /* =========================
       SEND MESSAGE TO AI
    ========================== */

    async function sendMessage() {

      const message =
        messageInput.value.trim();

      if(!message) return;


      addMessage(
        message,
        "user"
      );

      messageInput.value = "";


      const loadingMessage =
        document.createElement("div");

      loadingMessage.classList.add(
        "message",
        "bot-message"
      );

      loadingMessage.innerText =
        "PunjabAI ਸੋਚ ਰਿਹਾ ਹੈ...";

      chatBox.appendChild(
        loadingMessage
      );

      chatBox.scrollTop =
        chatBox.scrollHeight;


      try {

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        const data =
          await response.json();


        loadingMessage.remove();


        if(data.reply) {

          addMessage(
            data.reply,
            "bot"
          );

        }

        else {

          addMessage(
            "ਮਾਫ ਕਰਨਾ ਜੀ, ਕੋਈ ਜਵਾਬ ਨਹੀਂ ਮਿਲਿਆ।",
            "bot"
          );

        }

      }

      catch(error) {

        loadingMessage.remove();

        addMessage(
          "Server ਨਾਲ connection ਨਹੀਂ ਹੋ ਸਕਿਆ ਜੀ।",
          "bot"
        );

      }

    }


    /* SEND BUTTON */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER KEY */

    messageInput.addEventListener(
      "keypress",
      function(event) {

        if(event.key === "Enter") {

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
